<!DOCTYPE html>
<html lang="en" class="theme-warm">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Time Warning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="themes.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 16px;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--overlay-bg-1) 0%, var(--overlay-bg-2) 100%);
      color: var(--overlay-text);
      border: 1px solid var(--overlay-accent);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      max-width: 340px;
      transform: translateX(120%);
      animation: slideIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                 slideOut 0.4s ease-in forwards;
      animation-delay: 0s, 6.6s;
    }

    @keyframes slideIn {
      to { transform: translateX(0); }
    }
    @keyframes slideOut {
      to { transform: translateX(120%); opacity: 0; }
    }

    .icon {
      font-size: 34px;
      line-height: 1;
      flex-shrink: 0;
    }

    .text { display: flex; flex-direction: column; gap: 3px; }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: var(--overlay-accent);
      letter-spacing: 0.2px;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 300;
      color: var(--overlay-text-muted);
    }
  </style>
</head>
<body>
  <div class="toast">
    <div class="icon">&#127918;</div>
    <div class="text">
      <span class="title" id="title">30 minutes of game time left</span>
      <span class="subtitle">Daily game limit approaching</span>
    </div>
  </div>

  <script>
    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        // Soft two-note chime.
        [[880, 0], [1174.66, 0.16]].forEach(([freq, t]) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, now + t);
          gain.gain.linearRampToValueAtTime(0.18, now + t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + t + 0.5);
          osc.connect(gain).connect(ctx.destination);
          osc.start(now + t);
          osc.stop(now + t + 0.55);
        });
        setTimeout(() => ctx.close(), 1200);
      } catch (e) { /* no audio device — silent */ }
    }

    window.electronAPI.onGameWarningStart((data) => {
      if (data.theme) {
        document.documentElement.className = `theme-${data.theme}`;
      }
      const m = data.minutesLeft;
      document.getElementById('title').textContent =
        `${m} ${m === 1 ? 'minute' : 'minutes'} of game time left`;
      playChime();
    });
  </script>
</body>
</html>
