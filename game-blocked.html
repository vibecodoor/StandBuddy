<!DOCTYPE html>
<html lang="en" class="theme-warm">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Limit Reached</title>

  <link rel="stylesheet" href="themes.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, var(--overlay-bg-1) 0%, var(--overlay-bg-2) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--overlay-text);
      user-select: none;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 50% 30%, var(--overlay-accent-glow) 0%, transparent 50%);
      pointer-events: none;
      animation: glow 15s ease-in-out infinite alternate;
    }

    @keyframes glow {
      0% { opacity: 0.8; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    .container { text-align: center; position: relative; z-index: 1; }

    .icon {
      font-size: 88px;
      margin-bottom: 28px;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 52px;
      font-weight: 400;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 26px;
      font-weight: 300;
      margin-bottom: 44px;
      color: var(--overlay-accent);
      letter-spacing: 0.3px;
    }

    .countdown {
      font-size: 18px;
      font-weight: 300;
      color: var(--overlay-text-muted);
    }
    .countdown-number {
      font-size: 22px;
      font-weight: 500;
      color: var(--overlay-accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">&#9203;</div>
    <h1>Game Limit Reached</h1>
    <p class="subtitle" id="subtitle">You've used your daily game time. See you tomorrow.</p>
    <p class="countdown">Closing in <span class="countdown-number" id="countdown">5</span> seconds</p>
  </div>

  <script>
    const countdownEl = document.getElementById('countdown');
    let remaining = 5;

    function startCountdown() {
      const t = setInterval(() => {
        remaining--;
        if (remaining < 0) { clearInterval(t); return; }
        countdownEl.textContent = remaining;
      }, 1000);
    }

    window.electronAPI.onGameBlockedStart((data) => {
      if (data.theme) {
        document.documentElement.className = `theme-${data.theme}`;
      }
      if (data.limitHours) {
        document.getElementById('subtitle').textContent =
          `You've reached your ${data.limitHours}h daily game limit. See you tomorrow.`;
      }
      startCountdown();
    });
  </script>
</body>
</html>
